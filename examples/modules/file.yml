# file module — manage file / directory / symlink state and
# ownership. Supported states: file, directory, link, absent.

tasks:
  - name: ensure a directory exists with mode 0755
    module: file
    become: true
    params:
      path: /srv/mla-demo
      state: directory
      mode: "0755"
      owner: root
      group: root

  - name: touch an empty marker file
    module: file
    become: true
    params:
      path: /srv/mla-demo/.provisioned
      state: file
      mode: "0644"

  - name: create a symlink to /usr/bin/echo
    module: file
    become: true
    params:
      path: /usr/local/bin/mla-hello
      state: link
      src: /usr/bin/echo

  - name: remove a stale tmp directory
    module: file
    become: true
    params:
      path: /tmp/mla-stale
      state: absent
