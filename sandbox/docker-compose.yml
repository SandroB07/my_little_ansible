services:
  sandbox:
    build: .
    container_name: mla-sandbox
    hostname: mla-sandbox
    # systemd-in-docker needs elevated privileges.
    privileged: true
    cgroup: host
    ports:
      - "2222:22"
    volumes:
      # The key pair is generated by setup.sh; the public key is
      # mounted read-only as the user's authorized_keys.
      - ./id_mla.pub:/home/mla/.ssh/authorized_keys:ro
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    restart: unless-stopped
